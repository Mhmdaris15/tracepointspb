version: '3.8'

services:
  # ───────────────────────────────────────────────────────────────
  # 1. Nginx — Reverse Proxy (SSL termination + routing)
  # ───────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: tracepoint-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro  # Mount SSL certs here
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - tracepoint-net

  # ───────────────────────────────────────────────────────────────
  # 2. Frontend — Next.js (UI + SSR)
  # ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracepoint-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=wss://your-domain.com
      - NEXT_PUBLIC_YANDEX_MAPS_API_KEY=${YANDEX_MAPS_API_KEY}
    restart: unless-stopped
    networks:
      - tracepoint-net

  # ───────────────────────────────────────────────────────────────
  # 3. Backend — Node.js/Express + Socket.io (API + WebSockets)
  # ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracepoint-backend
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trace_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-tracepoint_db}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-CHANGE_THIS_IN_PRODUCTION}
      - JWT_EXPIRES_IN=7d
      - YANDEX_MAPS_API_KEY=${YANDEX_MAPS_API_KEY}
      - CORS_ORIGIN=https://your-domain.com
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - tracepoint-net

  # ───────────────────────────────────────────────────────────────
  # 4. PostgreSQL — Primary Database
  # ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: tracepoint-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-tracepoint_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trace_user} -d ${POSTGRES_DB:-tracepoint_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tracepoint-net

  # ───────────────────────────────────────────────────────────────
  # 5. Redis — Caching + Socket.io pub/sub for real-time GPS
  # ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tracepoint-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - tracepoint-net

volumes:
  pgdata:
    driver: local

networks:
  tracepoint-net:
    driver: bridge
